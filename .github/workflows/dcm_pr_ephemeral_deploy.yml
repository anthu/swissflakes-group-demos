name: DCM PR Ephemeral Deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy ephemeral environment for'
        required: true
        type: string

  issue_comment:
    types: [created]

env:
  DCM_PROJECT_PATH: data_products/sfg_logistics/
  SNOWFLAKE_PASSWORD: ${{ secrets.DEPLOYER_PAT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_CI_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  GATE:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/deploy-ephemeral'))
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
    - name: Resolve PR context
      id: resolve
      uses: actions/github-script@v8
      with:
        script: |
          let prNumber;
          if (context.eventName === 'workflow_dispatch') {
            prNumber = '${{ github.event.inputs.pr_number }}';
          } else {
            prNumber = context.issue.number.toString();
          }
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: parseInt(prNumber)
          });
          core.setOutput('pr_number', prNumber);
          core.setOutput('head_sha', pr.data.head.sha);

    - name: Post acknowledgment
      if: github.event_name == 'issue_comment'
      uses: actions/github-script@v8
      with:
        script: |
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `\u2699\ufe0f Ephemeral deploy triggered. [View workflow run](${runUrl})`
          });

  PARSE_MANIFEST:
    needs: GATE
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.get_targets.outputs.account }}
      role: ${{ steps.get_targets.outputs.role }}
      project_name: ${{ steps.get_targets.outputs.project_name }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.GATE.outputs.head_sha }}

    - name: Get targets from manifest
      id: get_targets
      run: |
        MANIFEST_PATH="${{ env.DCM_PROJECT_PATH }}manifest.yml"
        sed -i "s/___PR_NUMBER___/${{ needs.GATE.outputs.pr_number }}/g" "$MANIFEST_PATH"

        ACCOUNT=$(yq eval '.targets.PR_EPHEMERAL.account_identifier' "$MANIFEST_PATH" | sed 's/"//g' | sed "s/'//g")
        ROLE=$(yq eval '.targets.PR_EPHEMERAL.project_owner' "$MANIFEST_PATH" | sed 's/"//g' | sed "s/'//g")
        PROJECT_NAME=$(yq eval '.targets.PR_EPHEMERAL.project_name' "$MANIFEST_PATH" | sed 's/"//g' | sed "s/'//g")

        echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
        echo "role=$ROLE" >> $GITHUB_OUTPUT
        echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT

  CLONE_DATABASE:
    needs: [GATE, PARSE_MANIFEST]
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.GATE.outputs.head_sha }}

    - name: Setup Python + SnowCLI
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: .github/requirements-snowcli.txt
    - run: pip install -r .github/requirements-snowcli.txt

    - name: Clone source database
      run: |
        DB_NAME="SFG_LOGISTICS_PR${{ needs.GATE.outputs.pr_number }}"
        CI_ROLE="${{ env.SNOWFLAKE_CI_ROLE }}"
        snow sql -q "CREATE DATABASE IF NOT EXISTS ${DB_NAME} CLONE SFG_LOGISTICS" -x
        snow sql -q "GRANT OWNERSHIP ON DATABASE ${DB_NAME} TO ROLE ${CI_ROLE} COPY CURRENT GRANTS" -x
        snow sql -q "GRANT OWNERSHIP ON ALL SCHEMAS IN DATABASE ${DB_NAME} TO ROLE ${CI_ROLE} COPY CURRENT GRANTS" -x
        snow sql -q "GRANT OWNERSHIP ON ALL TABLES IN DATABASE ${DB_NAME} TO ROLE ${CI_ROLE} COPY CURRENT GRANTS" -x
        snow sql -q "GRANT OWNERSHIP ON ALL VIEWS IN DATABASE ${DB_NAME} TO ROLE ${CI_ROLE} COPY CURRENT GRANTS" -x
        snow sql -q "GRANT OWNERSHIP ON ALL DYNAMIC TABLES IN DATABASE ${DB_NAME} TO ROLE ${CI_ROLE} COPY CURRENT GRANTS" -x
        snow sql -q "GRANT OWNERSHIP ON ALL STAGES IN DATABASE ${DB_NAME} TO ROLE ${CI_ROLE} COPY CURRENT GRANTS" -x

  PLAN:
    needs: [GATE, PARSE_MANIFEST, CLONE_DATABASE]
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.GATE.outputs.head_sha }}

    - name: Resolve PR number in manifest
      run: sed -i "s/___PR_NUMBER___/${{ needs.GATE.outputs.pr_number }}/g" ${{ env.DCM_PROJECT_PATH }}manifest.yml

    - name: Setup Python + SnowCLI
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: .github/requirements-snowcli.txt
    - run: pip install -r .github/requirements-snowcli.txt

    - name: Create DCM project and run PLAN
      id: plan
      run: |
        cd ./$DCM_PROJECT_PATH

        snow dcm create --target PR_EPHEMERAL --if-not-exists -x

        if snow dcm plan --target PR_EPHEMERAL --save-output -x; then
          echo "plan_status=success" >> $GITHUB_OUTPUT
        else
          echo "plan_status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload PLAN output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pr-plan-output
        path: ${{ env.DCM_PROJECT_PATH }}out/plan.json

  DROP_DETECTION:
    needs: [GATE, PLAN]
    runs-on: ubuntu-latest
    steps:
    - name: Download plan artifact
      uses: actions/download-artifact@v7
      with:
        name: pr-plan-output
        path: ./

    - name: Check for destructive commands
      run: |
        PLAN_FILE="plan.json"
        if [ ! -f "$PLAN_FILE" ]; then
          echo "### Plan output file not found!" >> $GITHUB_STEP_SUMMARY
          ls -laR .
          exit 1
        fi

        DESTRUCTIVE_COMMANDS=$(jq -c '[.changeset[] | select(.type == "DROP" and (.object_id.domain | IN("DATABASE", "SCHEMA", "TABLE", "STAGE")))]' "$PLAN_FILE")
        TOTAL_DROPS=$(echo "$DESTRUCTIVE_COMMANDS" | jq 'length')
        if [[ $TOTAL_DROPS -gt 0 ]]; then
          DATABASE_DROPS=$(echo "$DESTRUCTIVE_COMMANDS" | jq '[.[] | select(.object_id.domain == "DATABASE")] | length')
          SCHEMA_DROPS=$(echo "$DESTRUCTIVE_COMMANDS" | jq '[.[] | select(.object_id.domain == "SCHEMA")] | length')
          TABLE_DROPS=$(echo "$DESTRUCTIVE_COMMANDS" | jq '[.[] | select(.object_id.domain == "TABLE")] | length')
          STAGE_DROPS=$(echo "$DESTRUCTIVE_COMMANDS" | jq '[.[] | select(.object_id.domain == "STAGE")] | length')

          {
            echo "### PLAN contains DROP commands"
            echo "The plan contains **${TOTAL_DROPS}** DROP operation(s):"
            echo "\`\`\`"
            if [[ $DATABASE_DROPS -gt 0 ]]; then echo "- Databases: ${DATABASE_DROPS}"; fi
            if [[ $SCHEMA_DROPS -gt 0 ]]; then echo "- Schemas: ${SCHEMA_DROPS}"; fi
            if [[ $TABLE_DROPS -gt 0 ]]; then echo "- Tables: ${TABLE_DROPS}"; fi
            if [[ $STAGE_DROPS -gt 0 ]]; then echo "- Stages: ${STAGE_DROPS}"; fi
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
        else
          echo "### No destructive DROP operations found" >> $GITHUB_STEP_SUMMARY
        fi

  DEPLOY:
    needs: [GATE, PARSE_MANIFEST, DROP_DETECTION]
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.GATE.outputs.head_sha }}

    - name: Resolve PR number in manifest
      run: sed -i "s/___PR_NUMBER___/${{ needs.GATE.outputs.pr_number }}/g" ${{ env.DCM_PROJECT_PATH }}manifest.yml

    - name: Setup Python + SnowCLI
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: .github/requirements-snowcli.txt
    - run: pip install -r .github/requirements-snowcli.txt

    - name: Deploy ephemeral environment
      run: |
        cd ./$DCM_PROJECT_PATH

        set +e
        SHORT_SHA=$(echo "${{ needs.GATE.outputs.head_sha }}" | cut -c1-7)
        snow dcm deploy --target PR_EPHEMERAL --alias "pr-${{ needs.GATE.outputs.pr_number }}-run${{ github.run_number }}-${SHORT_SHA}" -x 2>&1 | tee /tmp/deploy_output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          echo "### DCM Deploy for PR #${{ needs.GATE.outputs.pr_number }} successful" >> $GITHUB_STEP_SUMMARY
        else
          {
            echo "### DCM Deploy for PR #${{ needs.GATE.outputs.pr_number }} failed"
            echo "\`\`\`"
            cat /tmp/deploy_output.txt
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
        fi

  REFRESH_DYNAMIC_TABLES:
    needs: [GATE, PARSE_MANIFEST, DEPLOY]
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.GATE.outputs.head_sha }}

    - name: Resolve PR number in manifest
      run: sed -i "s/___PR_NUMBER___/${{ needs.GATE.outputs.pr_number }}/g" ${{ env.DCM_PROJECT_PATH }}manifest.yml

    - name: Setup Python + SnowCLI
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: .github/requirements-snowcli.txt
    - run: pip install -r .github/requirements-snowcli.txt

    - name: Refresh Dynamic Tables
      run: |
        cd ./$DCM_PROJECT_PATH
        set +e
        REFRESH_OUTPUT=$(snow dcm refresh --target PR_EPHEMERAL -x 2>&1)
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          echo "### Dynamic Tables Refresh Successful" >> $GITHUB_STEP_SUMMARY
        else
          {
            echo "### Dynamic Tables Refresh Failed"
            echo "\`\`\`"
            echo "$REFRESH_OUTPUT"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
        fi

  TEST_EXPECTATIONS:
    needs: [GATE, PARSE_MANIFEST, REFRESH_DYNAMIC_TABLES]
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_CI_ROLE }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.GATE.outputs.head_sha }}

    - name: Resolve PR number in manifest
      run: sed -i "s/___PR_NUMBER___/${{ needs.GATE.outputs.pr_number }}/g" ${{ env.DCM_PROJECT_PATH }}manifest.yml

    - name: Setup Python + SnowCLI
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: .github/requirements-snowcli.txt
    - run: pip install -r .github/requirements-snowcli.txt

    - name: Test Data Quality Expectations
      run: |
        cd ./$DCM_PROJECT_PATH
        set +e
        TEST_OUTPUT=$(snow dcm test --target PR_EPHEMERAL -x 2>&1)
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          {
            echo "### Data Quality Tests Passed"
            echo "All expectations met."
          } >> $GITHUB_STEP_SUMMARY
        else
          {
            echo "### Data Quality Tests Failed"
            echo "\`\`\`"
            echo "$TEST_OUTPUT"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
        fi

  COMMENT_ON_PR:
    needs: [GATE, CLONE_DATABASE, PLAN, DROP_DETECTION, DEPLOY, REFRESH_DYNAMIC_TABLES, TEST_EXPECTATIONS]
    if: always() && needs.GATE.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download plan artifact
        uses: actions/download-artifact@v7
        with:
          pattern: '*-plan-output'
          merge-multiple: true

      - name: Post summary to PR
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.GATE.outputs.pr_number }}
          CLONE_DB_RESULT: ${{ needs.CLONE_DATABASE.result }}
          PLAN_RESULT: ${{ needs.PLAN.result }}
          DROP_DETECTION_RESULT: ${{ needs.DROP_DETECTION.result }}
          DEPLOY_RESULT: ${{ needs.DEPLOY.result }}
          REFRESH_RESULT: ${{ needs.REFRESH_DYNAMIC_TABLES.result }}
          TEST_RESULT: ${{ needs.TEST_EXPECTATIONS.result }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = process.env.PR_NUMBER;

            const getIcon = (result) => {
              const r = (result || '').toLowerCase();
              if (r === 'success') return '\u2705';
              if (r === 'failure') return '\u274c';
              if (r === 'skipped') return '\u23ed\ufe0f';
              return '\u26a0\ufe0f';
            };

            const jobs = {
              'Clone Database': process.env.CLONE_DB_RESULT,
              'Plan': process.env.PLAN_RESULT,
              'Drop Detection': process.env.DROP_DETECTION_RESULT,
              'Deploy': process.env.DEPLOY_RESULT,
              'Refresh Dynamic Tables': process.env.REFRESH_RESULT,
              'Test Expectations': process.env.TEST_RESULT
            };

            let body = `## DCM Ephemeral Deploy -- PR #${prNumber}\n\n`;
            body += `| Job | Result |\n|-----|--------|\n`;
            for (const [job, result] of Object.entries(jobs)) {
              body += `| ${job} | ${getIcon(result)} ${result || 'n/a'} |\n`;
            }

            // Include plan details if available
            try {
              const plan = JSON.parse(fs.readFileSync('plan.json', 'utf8'));
              const changeset = plan.changeset || [];
              if (changeset.length > 0) {
                body += `\n<details>\n<summary>Plan details (${changeset.length} objects)</summary>\n\n`;
                body += `| Operation | Domain | Object |\n|-----------|--------|--------|\n`;
                changeset.forEach(c => {
                  body += `| ${c.type} | ${c.object_id.domain} | \`${c.object_id.name}\` |\n`;
                });
                body += `\n</details>\n`;
              }
            } catch (e) {
              body += `\n_Could not load plan details._\n`;
            }

            body += `\n---\n`;
            body += `> Environment: \`SFG_LOGISTICS_PR${prNumber}\`\n`;
            body += `> [View workflow run](${runUrl})`;

            await github.rest.issues.createComment({
              issue_number: parseInt(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
